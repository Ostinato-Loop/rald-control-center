name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-rald-control-center
  cancel-in-progress: false

jobs:
  deploy-api:
    name: Deploy API Worker + run D1 migrations
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install API dependencies
        working-directory: apps/api
        run: npm install

      - name: Run D1 migrations
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply rald-control-center-db --remote

      - name: Deploy API Worker
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Push secrets to Worker
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GITHUB_TOKEN_SECRET: ${{ secrets.GH_TOKEN }}
          N8N_URL: ${{ secrets.N8N_URL }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          for SECRET_NAME in JWT_SECRET GITHUB_TOKEN N8N_URL N8N_API_KEY AWS_REGION; do
            VAL=$(printenv "$SECRET_NAME" 2>/dev/null || true)
            if [ -n "$VAL" ]; then
              echo "$VAL" | npx wrangler secret put "$SECRET_NAME" --name rald-control-center-api
              echo "  pushed $SECRET_NAME"
            else
              echo "  WARNING: $SECRET_NAME not set in GitHub secrets"
            fi
          done
