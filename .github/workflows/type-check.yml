name: Type Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  type-check-api:
    name: Type Check API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
        working-directory: apps/api
      - run: npm run type-check
        working-directory: apps/api

  type-check-web:
    name: Type Check Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
        working-directory: apps/web
      - run: npm run type-check
        working-directory: apps/web
