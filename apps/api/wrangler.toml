name = "rald-control-center-api"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"

# Secrets (set via wrangler secret put or GitHub Actions):
# JWT_SECRET, GITHUB_TOKEN, N8N_URL, N8N_API_KEY
# CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN, AWS_REGION
# SUPABASE_URL, SUPABASE_SERVICE_KEY (for RALD system integration)

[[d1_databases]]
binding = "DB"
database_name = "rald-control-center-db"
database_id = "a904867c-083d-40b5-a230-12e2be0ac771"

[[routes]]
pattern = "api.control.rald.cloud/*"
zone_name = "rald.cloud"
